<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💜 Happy Birthday 💜</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Music -->
<audio id="music" preload="auto">
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<!-- Stars -->
<div id="stars"></div>

<!-- Balloons -->
<div id="balloons"></div>

<!-- Main Container -->
<div class="container">

<h1 class="title">
🎉 HAPPY BIRTHDAY 🎉
</h1>

<h2 class="subtitle">
💜 May Your Day Shine Like BTS 💜
</h2>

<!-- BTS Slideshow -->
<div class="slideshow">

<img id="slide" src="bts/photo1.jpeg" alt="BTS">

</div>

<!-- Gift Box -->
<div id="gift" onclick="openGift()">

<div class="lid"></div>

<div class="box"></div>

<div class="ribbonV"></div>

<div class="ribbonH"></div>

</div>

<p id="clickText" class="clickText">
    🎁 Click the Gift 🎁
</p>

<!-- Hidden Message -->

<div id="birthdayContent">

    <h2>🎂 Happy Birthday 🎂</h2>

    <p>
        May happiness, love, success and BTS always stay with you.
        <br><br>
        Have an unforgettable birthday!
        <br><br>
        💜💜💜
    </p>

    <div class="cake">

        <div class="plate"></div>

        <div class="layer bottom"></div>

        <div class="layer middle"></div>

        <div class="layer top"></div>

        <div class="icing"></div>

        <div class="candle">
            <div class="flame"></div>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
